<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classify · Account setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/homeroom.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-2);
      }
      .login-card {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--rad-lg);
        padding: 36px 40px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      }
      .login-brand {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 28px;
        margin-bottom: 6px;
      }
      .login-brand span { color: var(--terra); }
      .login-subtitle {
        font-size: 13px;
        color: var(--ink-3);
        margin-bottom: 28px;
      }
      .login-card label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-3);
        margin-bottom: 5px;
      }
      .login-card input[type=text],
      .login-card input[type=password] {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: var(--rad);
        font-size: 14px;
        font-family: inherit;
        background: var(--bg-2);
        color: var(--ink);
        outline: none;
        margin-bottom: 16px;
        transition: border-color 0.15s;
      }
      .login-card input:focus { border-color: var(--terra); }
      .login-btn {
        width: 100%;
        padding: 10px;
        background: var(--terra);
        color: #fff;
        border: none;
        border-radius: var(--rad);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
        transition: opacity 0.15s;
      }
      .login-btn:hover { opacity: 0.88; }
      .login-error {
        background: var(--rose-soft, oklch(0.95 0.03 15));
        border: 1px solid var(--rose, oklch(0.65 0.18 15));
        color: var(--rose, oklch(0.55 0.18 15));
        border-radius: var(--rad);
        padding: 9px 12px;
        font-size: 13px;
        margin-bottom: 16px;
      }
      .login-success {
        background: oklch(0.95 0.04 145);
        border: 1px solid oklch(0.65 0.15 145);
        color: oklch(0.35 0.12 145);
        border-radius: var(--rad);
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.5;
      }
      .login-success a {
        color: var(--terra);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-brand"><span>Class</span>ify</div>
      <div class="login-subtitle">Set up your account with your invite code.</div>

      {% if success %}
      <div class="login-success">
        Your password has been set. <a href="/login">Sign in now →</a>
      </div>
      {% else %}

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/setup">
        <label for="code">Invite code</label>
        <input id="code" name="code" type="text" placeholder="Paste your invite code" autocomplete="off" autofocus required />

        <label for="password">Choose a password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required />

        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required />

        <button class="login-btn" type="submit">Set password</button>
      </form>

      <div style="margin-top:16px;font-size:12px;color:var(--ink-4);text-align:center;">
        Already set up? <a href="/login" style="color:var(--terra);text-decoration:none;">Sign in</a>
      </div>

      {% endif %}
    </div>
  </body>
</html>
