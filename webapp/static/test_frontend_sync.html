<!DOCTYPE html>
<html>
<head>
  <title>Multi-User Sync Frontend Test</title>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 800px; margin: 0 auto; }
    .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #d1ecf1; color: #0c5460; }
    button { padding: 8px 16px; margin: 5px; cursor: pointer; }
    #log { background: #f5f5f5; padding: 10px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    .log-entry { margin: 2px 0; }
  </style>
</head>
<body>
  <h1>Multi-User Sync Frontend Test</h1>

  <div class="status info">
    <strong>Session ID:</strong> <span id="sessionId"></span><br>
    <strong>Session Name:</strong> <span id="sessionName"></span>
  </div>

  <div id="lockStatus" class="status">
    Loading...
  </div>

  <div>
    <button onclick="testAcquireLock()">Acquire Lock</button>
    <button onclick="testReleaseLock()">Release Lock</button>
    <button onclick="testMutatingRequest()">Test Mutating Request</button>
    <button onclick="testFetchHeaders()">Test Fetch Headers</button>
    <button onclick="clearLog()">Clear Log</button>
  </div>

  <h3>Log</h3>
  <div id="log"></div>

  <script src="/static/js/sync-client.js"></script>
  <script>
    // Display session info
    document.getElementById('sessionId').textContent = window.sessionId;
    document.getElementById('sessionName').textContent = window.sessionName || '(not set)';

    function log(message, type = 'info') {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const timestamp = new Date().toLocaleTimeString();
      entry.innerHTML = `<span style="color: #666;">[${timestamp}]</span> ${message}`;
      if (type === 'error') entry.style.color = 'red';
      if (type === 'success') entry.style.color = 'green';
      document.getElementById('log').appendChild(entry);
      document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
    }

    function updateLockStatus() {
      const status = window.lockStatus;
      const el = document.getElementById('lockStatus');

      if (!status.locked) {
        el.className = 'status success';
        el.innerHTML = '<strong>Status:</strong> Lock available';
      } else if (status.is_holder) {
        el.className = 'status success';
        el.innerHTML = `<strong>Status:</strong> You hold the lock (expires in ${status.expires_in}s)`;
      } else {
        el.className = 'status error';
        el.innerHTML = `<strong>Status:</strong> Read-only mode - ${status.held_by} is editing`;
      }
    }

    // Override updateLockIndicator to also update our status display
    const originalUpdateLockIndicator = window.updateLockIndicator;
    window.updateLockIndicator = function(lockStatus) {
      originalUpdateLockIndicator(lockStatus);
      updateLockStatus();
    };

    async function testAcquireLock() {
      log('Attempting to acquire lock...');
      try {
        await window.tryAcquireLock();
        log('Lock acquisition attempt completed', 'success');
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function testReleaseLock() {
      log('Releasing lock...');
      try {
        await window.releaseLock();
        log('Lock released', 'success');
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function testMutatingRequest() {
      log('Testing mutating request (POST /api/config)...');
      try {
        const response = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ test_field: 'test_value_' + Date.now() })
        });

        const result = await response.json();

        if (response.ok) {
          log(`✓ Request succeeded: ${JSON.stringify(result)}`, 'success');
        } else {
          log(`✗ Request blocked: ${result.error || JSON.stringify(result)}`, 'error');
        }
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    async function testFetchHeaders() {
      log('Testing that fetch includes X-Session-ID header...');

      // Make a request and log what headers were sent
      // (We can't directly inspect request headers from JS, but we can verify the backend receives it)
      try {
        const response = await fetch('/api/config');
        const config = await response.json();

        // The fact that we can make requests means the header wrapper is working
        log('✓ Fetch wrapper is active (requests are being made successfully)', 'success');
        log(`Session ID being sent: ${window.sessionId}`, 'info');
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
      }
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    // Initialize sync
    log('Initializing sync client...');
    window.initSync().then(() => {
      log('Sync client initialized', 'success');
      updateLockStatus();
    });

    // Periodic status updates
    setInterval(updateLockStatus, 1000);
  </script>
</body>
</html>
