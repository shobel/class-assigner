name: Build Classify

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Flask bundle (PyInstaller)
        run: python -m PyInstaller classify.spec --noconfirm --clean

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p actions_keychain /tmp/build.keychain
          security default-keychain -s /tmp/build.keychain
          security unlock-keychain -p actions_keychain /tmp/build.keychain
          security import /tmp/certificate.p12 -k /tmp/build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions_keychain /tmp/build.keychain
          rm /tmp/certificate.p12

      - name: Build and sign macOS DMG
        working-directory: electron
        run: npx electron-builder --mac --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: List dist folder
        run: ls -lh dist/

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Classify-mac
          path: dist/Classify-*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Flask bundle (PyInstaller)
        run: python -m PyInstaller classify.spec --noconfirm --clean

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows installer
        working-directory: electron
        run: npx electron-builder --win --publish never

      - name: List dist folder
        run: Get-ChildItem dist/ -Recurse | Select-Object FullName, Length
        shell: powershell

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Classify-win
          path: dist/Classify-Setup-*.exe
